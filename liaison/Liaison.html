
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_liaison.css">
    <title>Liaison </title>
</head>

<body>

<div class="container">

    <h1>Liaison </h1>

    <div class="formulaire">
        <div class="champ">
            <label for="depart">Départ</label>
            <select id="depart">
                <option value="">Choisir le départ</option>
                <option value="Port A">Port A</option>
                <option value="Port B">Port B</option>
                <option value="Port C">Port C</option>
            </select>
        </div>

        <div class="champ">
            <label for="arrivee">Arrivée</label>
            <select id="arrivee">
                <option value="">Choisir l'arrivée</option>
                <option value="Port A">Port A</option>
                <option value="Port B">Port B</option>
                <option value="Port C">Port C</option>
            </select>
        </div>

        <button class="btn" onclick="rechercher()">
            Rechercher les tarifs
        </button>

    </div>

</div>
</body>
</html>
